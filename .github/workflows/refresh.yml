name: Refresh tokens
on:
  schedule:
    - cron: "0 9 1,15 * *"   # twice a month, well inside the 60-day expiry
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: python refresh.py
        env:
          IG_TOKEN_MELLO: ${{ secrets.IG_TOKEN_MELLO }}
      - name: Store refreshed token
        if: steps.r.outputs.IG_TOKEN_MELLO != ''
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          NEW: ${{ steps.r.outputs.IG_TOKEN_MELLO }}
        run: |
          echo "::add-mask::$NEW"
          gh secret set IG_TOKEN_MELLO --body "$NEW" --repo "$GITHUB_REPOSITORY"
